spring.application.name=aiDemo
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=pars-qwen
spring.ai.ollama.chat.options.num-predict=128
spring.ai.ollama.chat.options.temperature=0.1
spring.ai.chat.client.tool-calling.enabled=true




spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.ai.ollama.embedding.options.model=nomic-embed-text